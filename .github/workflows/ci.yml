# Phase 0 item [7]: CI quality gates, proposal §13 order —
#   format/lint -> type check -> unit+integration tests -> coverage
#   -> Bandit -> pip-audit -> Docker build
#
# The workflow is local-only for now (work is committed, not pushed, per
# docs/CONVENTIONS.md §2); it activates on the first push to the remote.

name: CI

on:
  push:
    branches: [main, local_commit]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format / lint / types / tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Tests with coverage gate
        run: python -m pytest tests --cov=src --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  performance:
    name: p95 regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-api.txt -r requirements-dev.txt

      # Post-RC item [100]: the NFR is only real if a commit cannot quietly
      # undo it. Same benchmark, HTTP-only, small fixed load so the step stays
      # short; `scripts/benchmark.py` exits 1 when worst p95 >= the 300 ms
      # budget. Worker throughput is machine-dependent and therefore NOT
      # gated here (it is measured on demand and recorded in docs/reports/).
      - name: API p95 budget (NFR < 300 ms)
        run: |
          python scripts/benchmark.py --api-only --requests 40 --threads 4 \
            --seed-executions 50 --audit-events 20 \
            --json docs/reports/perf-ci.json

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-ci
          path: docs/reports/perf-ci.json
          if-no-files-found: ignore

  security:
    name: bandit / pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dev.txt

      # Medium+ severity gate: findings must be zero (audited `# nosec`
      # annotations are documented in docs/THIRD_PARTY_NOTICES.md and
      # re-reviewed in Phase 9 [82]).
      - name: Bandit (medium+ severity)
        run: bandit -r src -ll -ii

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements-api.txt

      # Phase 9 item [82]: committed credentials fail the build. Fixture
      # exemptions are explicit inline markers, never a config allow-list.
      - name: Secret scan
        run: python scripts/secret_scan.py

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t auto-system-agent-api:ci .
